<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organização Voluntários</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" as="style">
  <meta name="description" content="Organização Voluntários - educação, solidariedade e impacto social.">
  <meta name="robots" content="index, follow" />
</head>
<body>
  <header>
    <nav class="navbar" aria-label="Menu principal">
      <img src="./img/logo.png" alt="Logo" class="logo-img" />
      <button class="menu-toggle" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menu" onclick="toggleMenu()">☰</button>
      <ul id="navMenu">
        <li><a href="#/" data-link>Início</a></li>
        <li><a href="#/projetos" data-link>Projetos</a></li>
        <li><a href="#/cadastro" data-link>Cadastro</a></li>
      </ul>
    </nav>
  </header>
  
  <!-- AQUI o roteador injeta o conteúdo de cada página -->
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <button id="toggleTheme" aria-label="Alternar modo escuro/claro">🌓</button>

  <footer role="contentinfo">
    <p>&copy; <span id="year"></span> Organização de Voluntários. Todos os direitos reservados.</p>
    <p>Feito com 💙 para transformar vidas.</p>
  </footer>

  <!-- Teu JS legado (dark-mode, máscaras, tabela). Ele já existe -->
  <script src="./script.js"></script>

  <!-- SPA -->
  <script type="module" src="./js/app.js"></script>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    // toggleMenu já é definido no teu script.js; deixei aqui só a chamada no botão
  </script>
</body>
</html>
